<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop All Products — URBANNEX</title><meta name="description" content="Browse fashion, electronics, shoes, watches, beauty, home and gadgets at URBANNEX. Order on WhatsApp."><meta property="og:title" content="Shop All Products — URBANNEX"><meta property="og:description" content="Browse fashion, electronics, shoes, watches, beauty, home and gadgets at URBANNEX. Order on WhatsApp."><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head>
<body><header id="hdr"></header><main class="sec"><div class="container">
<div class="sh"><h1 class="h2" style="font-family:'Playfair Display'">All Products</h1><span id="count" class="text-muted small" aria-live="polite"></span></div>
<div class="row g-2 mb-3"><div class="col-12 col-md-6"><label class="visually-hidden" for="q">Search products</label><input id="q" type="search" class="form-control rounded-pill px-3" placeholder="Search products, e.g. watch"></div>
<div class="col-6 col-md-3"><label class="visually-hidden" for="sort">Sort</label><select id="sort" class="form-select rounded-pill"><option value="feat">Featured</option><option value="lo">Price Low to High</option><option value="hi">Price High to Low</option><option value="rate">Highest Rated</option><option value="new">Newest</option></select></div>
<div class="col-6 col-md-3"><label class="visually-hidden" for="price">Price</label><select id="price" class="form-select rounded-pill"><option value="">Any price</option><option value="0-2000">Under Rs. 2,000</option><option value="2000-5000">Rs. 2,000–5,000</option><option value="5000-10000">Rs. 5,000–10,000</option><option value="10000-9e9">Above Rs. 10,000</option></select></div></div>
<div class="chips mb-4" id="chips"></div><div class="row g-3" id="grid"></div><nav aria-label="Pagination"><ul class="pagination justify-content-center mt-4" id="pager"></ul></nav>
<div class="empty" id="empty" hidden><i class="bi bi-search"></i><h2 class="h4 mt-2">No products found</h2><p>Try searching for something else.</p><button class="btn btn-dark-u" id="clr">Clear Search</button></div></div></main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="js/products.js"></script><script src="js/main.js"></script>
<script>
const P=new URLSearchParams(location.search),S={q:P.get("q")||"",cat:P.get("cat")||"All",sort:P.get("sort")||"feat",price:"",page:1,wish:P.get("wish")==="1"},PER=8;
function view(){let l=PRODUCTS.filter(p=>(S.cat==="All"||p.category===S.cat)&&(!S.wish||wl().includes(p.id))&&(p.name+" "+p.category).toLowerCase().includes(S.q.toLowerCase().trim()));
 if(S.price){const[a,b]=S.price.split("-").map(Number);l=l.filter(p=>p.price>=a&&p.price<b)}
 const o={lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,rate:(a,b)=>b.rating-a.rating,new:(a,b)=>b.id-a.id,feat:(a,b)=>a.id-b.id};l.sort(o[S.sort]);return l}
function draw(){const l=view(),pages=Math.max(1,Math.ceil(l.length/PER));S.page=Math.min(S.page,pages);
 $("#count").textContent=`${l.length} product${l.length===1?"":"s"} found`+(S.wish?" in your wishlist":"");
 $("#empty").hidden=l.length>0;$("#empty h2").textContent=S.wish&&!wl().length?"Your wishlist is empty":"No products found";
 renderGrid("#grid",l.slice((S.page-1)*PER,S.page*PER));
 $("#pager").innerHTML=pages<2?"":Array.from({length:pages},(_,i)=>`<li class="page-item ${i+1===S.page?"active":""}"><button class="page-link" data-pg="${i+1}">${i+1}</button></li>`).join("");
 $("#chips").innerHTML=["All",...CATS].map(c=>`<button class="chip ${S.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")+(S.wish?`<button class="chip on" data-c="x">♥ Wishlist ✕</button>`:"")}
function onWishChange(){if(S.wish)draw()}
document.addEventListener("DOMContentLoaded",()=>{$("#q").value=S.q;$("#sort").value=S.sort;draw();if(P.get("focus"))$("#q").focus();
 $("#q").oninput=e=>{S.q=e.target.value;S.page=1;draw()};$("#sort").onchange=e=>{S.sort=e.target.value;draw()};$("#price").onchange=e=>{S.price=e.target.value;S.page=1;draw()};
 $("#clr").onclick=()=>{S.q="";S.cat="All";S.price="";S.wish=false;$("#q").value="";$("#price").value="";draw()};
 $("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;if(b.dataset.c==="x")S.wish=false;else S.cat=b.dataset.c;S.page=1;draw()};
 $("#pager").onclick=e=>{const b=e.target.closest("[data-pg]");if(b){S.page=+b.dataset.pg;draw();scrollTo({top:0,behavior:"smooth"})}}});</script></body></html>
