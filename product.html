<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details — URBANNEX</title><meta name="description" content="View product details, choose colour and size, and order on WhatsApp at URBANNEX."><meta property="og:title" content="Product Details — URBANNEX"><meta property="og:description" content="View product details, choose colour and size, and order on WhatsApp at URBANNEX."><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head>
<body><header id="hdr"></header><main class="sec"><div class="container" id="pd"></div>
<div class="container mt-5"><div class="sh"><h2 class="h3" style="font-family:'Playfair Display'">Related Products</h2></div><div class="row g-3" id="rel"></div></div></main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="js/products.js"></script><script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const p=find(new URLSearchParams(location.search).get("id"));const pd=$("#pd");
 if(!p){pd.innerHTML=`<div class="empty"><i class="bi bi-bag-x"></i><h1 class="h4 mt-2">Product not found</h1><a class="btn btn-dark-u mt-2" href="shop.html">Back to Shop</a></div>`;return}
 document.title=p.name+" — URBANNEX";let color=p.colors[0],size=p.sizes[0],qty=1;
 pd.innerHTML=`<div class="row g-4 g-lg-5"><div class="col-lg-6"><div class="gal-main" id="gm"><img id="mi" src="${p.gallery[0]}" alt="${p.name}"></div>
 <div class="d-flex gap-2 mt-3 align-items-center"><button class="btn btn-sm btn-outline-dark rounded-circle" id="pv" aria-label="Previous image"><i class="bi bi-chevron-left"></i></button>${p.gallery.map((g,i)=>`<img class="thumb ${i?"":"on"}" data-i="${i}" src="${g}" alt="${p.name} view ${i+1}">`).join("")}<button class="btn btn-sm btn-outline-dark rounded-circle" id="nx" aria-label="Next image"><i class="bi bi-chevron-right"></i></button></div></div>
 <div class="col-lg-6"><small class="cat">${p.category}</small><h1 class="h2 fw-bold">${p.name}</h1><div class="rate">${stars(p.rating)} <span>${p.rating} · ${p.reviews} reviews</span></div>
 <div class="price my-3 fs-4"><b>${money(p.price)}</b> <del>${money(p.oldPrice)}</del> <span class="badge bg-dark">-${p.discount}%</span></div><p>${p.description}</p>
 <div class="mb-3"><b class="small d-block mb-1">Color</b>${p.colors.map((c,i)=>`<button class="opt ${i?"":"on"}" data-col="${c}">${c}</button>`).join("")}</div>
 ${p.sizes.length?`<div class="mb-3"><b class="small d-block mb-1">Size</b>${p.sizes.map((s,i)=>`<button class="opt ${i?"":"on"}" data-sz="${s}">${s}</button>`).join("")}</div>`:""}
 <div class="d-flex align-items-center gap-3 mb-3"><div class="input-group" style="width:130px"><button class="btn btn-outline-dark" id="m" aria-label="Decrease">−</button><input id="qn" class="form-control text-center" value="1" readonly aria-label="Quantity"><button class="btn btn-outline-dark" id="pl" aria-label="Increase">+</button></div>
 <span class="stock ${p.stock?"":"out"}">${p.stock===0?"Out of stock":p.stock<10?"Only "+p.stock+" left":"In stock"}</span></div>
 <div class="d-flex gap-2 flex-wrap"><button class="wa" id="ow" style="width:auto;flex:1;min-width:200px"><i class="bi bi-whatsapp"></i> Order on WhatsApp</button><button class="btn btn-outline-dark rounded-circle" style="width:48px;height:48px" data-wish="${p.id}" aria-label="Wishlist"><i class="bi bi-heart${wl().includes(p.id)?"-fill":""}"></i></button></div></div></div>
 <ul class="nav nav-tabs mt-5" role="tablist">${["Description","Specifications","Reviews","Shipping & Returns"].map((t,i)=>`<li class="nav-item"><button class="nav-link ${i?"":"active"}" data-bs-toggle="tab" data-bs-target="#t${i}" role="tab">${t}</button></li>`).join("")}</ul>
 <div class="tab-content p-3 border border-top-0 rounded-bottom"><div class="tab-pane fade show active" id="t0">${p.description} Crafted for everyday wear with attention to detail.</div>
 <div class="tab-pane fade" id="t1"><ul class="mb-0"><li>Category: ${p.category}</li><li>Colors: ${p.colors.join(", ")}</li>${p.sizes.length?`<li>Sizes: ${p.sizes.join(", ")}</li>`:""}<li>Warranty: 7-day replacement</li></ul></div>
 <div class="tab-pane fade" id="t2"><p class="mb-0">${stars(p.rating)} ${p.rating}/5 from ${p.reviews} verified buyers. “Great quality and quick delivery.”</p></div>
 <div class="tab-pane fade" id="t3">Free shipping nationwide. Delivery in 2–5 working days. Easy 7-day returns on unused items.</div></div>`;
 let gi=0;const go=i=>{gi=(i+3)%3;$("#mi").src=p.gallery[gi];$$(".thumb").forEach((t,k)=>t.classList.toggle("on",k===gi))};
 $("#pv").onclick=()=>go(gi-1);$("#nx").onclick=()=>go(gi+1);$$(".thumb").forEach(t=>t.onclick=()=>go(+t.dataset.i));
 $("#gm").onmousemove=e=>{const r=e.currentTarget.getBoundingClientRect();$("#mi").style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;$("#mi").style.transform="scale(1.8)"};$("#gm").onmouseleave=()=>$("#mi").style.transform="";
 pd.onclick=e=>{const c=e.target.closest("[data-col],[data-sz]");if(!c)return;const k=c.dataset.col?"data-col":"data-sz";$$(`[${k}]`).forEach(o=>o.classList.remove("on"));c.classList.add("on");if(c.dataset.col)color=c.dataset.col;else size=c.dataset.sz};
 $("#m").onclick=()=>$("#qn").value=qty=Math.max(1,qty-1);$("#pl").onclick=()=>$("#qn").value=qty=Math.min(10,qty+1);
 $("#ow").onclick=()=>orderWA(p,{color,size,qty});
 renderGrid("#rel",PRODUCTS.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4));});</script></body></html>
